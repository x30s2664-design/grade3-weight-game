<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三年級重量遊戲</title>
<link rel="stylesheet" href="shared.css">
<style>
.home{max-width:980px;margin:0 auto;padding:22px}
.hero{margin-bottom:20px}
.hero h1{font-size:clamp(30px,5vw,48px);margin:6px 0}
.hero p{color:var(--muted);margin:0}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:24px;padding:20px;min-width:0}
.card .icon{font-size:58px}
.card h2{margin:8px 0 4px}
.card p{color:var(--muted);min-height:48px}
.card .progress{height:auto;width:auto;background:none;font-weight:800;color:var(--text);margin:10px 0}
.play{
  min-height:48px;border-radius:14px;padding:0 16px;display:flex;align-items:center;justify-content:center;
  text-decoration:none;font-weight:800;background:var(--accent);color:#fff
}
.play.locked{background:#e5e7eb;color:#6b7280;pointer-events:none}
.lockline{font-size:13px;color:var(--muted);margin-top:8px}
.reset{margin-top:18px;border:1px solid var(--border);background:var(--panel);border-radius:12px;padding:10px 14px}
@media(max-width:760px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="home">
  <section class="hero">
    <div class="eyebrow">三年級數學・重量</div>
    <h1>重量拖拖樂</h1>
    <p>每一關成功 3 次，才會解鎖下一個重量世界。</p>
  </section>

  <section class="cards">
    <article class="card">
      <div class="icon">🍎</div>
      <h2>第一關：公克 g</h2>
      <p>小物品直接拖曳，先感受重量，再放到秤盤。</p>
      <div class="progress" id="gramsProgress">0 / 3 次</div>
      <a class="play" href="grams.html">開始遊戲</a>
    </article>

    <article class="card">
      <div class="icon">🎒</div>
      <h2>第二關：公斤 kg</h2>
      <p>更重的生活物品，拖曳速度會更慢。</p>
      <div class="progress" id="kgProgress">0 / 3 次</div>
      <a class="play locked" id="kgLink" href="kilograms.html">尚未解鎖</a>
      <div class="lockline" id="kgLock">第一關成功 3 次後解鎖</div>
    </article>

    <article class="card">
      <div class="icon">🚜</div>
      <h2>第三關：噸 t</h2>
      <p>操作鏟車搬運噸級物品到大型地磅。</p>
      <div class="progress" id="tonsProgress">0 / 3 次</div>
      <a class="play locked" id="tonsLink" href="tons.html">尚未解鎖</a>
      <div class="lockline" id="tonsLock">第二關成功 3 次後解鎖</div>
    </article>
  </section>

  <button class="reset" id="resetBtn" type="button">重設遊戲進度</button>
</main>

<script src="shared.js"></script>
<script>
const p=GameCore.loadProgress();
gramsProgress.textContent=`${p.gramsWins} / 3 次`;
kgProgress.textContent=`${p.kilogramsWins} / 3 次`;
tonsProgress.textContent=`${p.tonsWins} / 3 次`;

if(GameCore.isUnlocked('kilograms')){
  kgLink.classList.remove('locked'); kgLink.textContent='開始遊戲'; kgLock.textContent='已解鎖';
}
if(GameCore.isUnlocked('tons')){
  tonsLink.classList.remove('locked'); tonsLink.textContent='開始遊戲'; tonsLock.textContent='已解鎖';
}
resetBtn.addEventListener('click',()=>{
  if(confirm('要把三個關卡的進度全部歸零嗎？')){
    GameCore.resetAll(); location.reload();
  }
});
</script>
</body>
</html>
